<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Questly</title>
<style>
  :root {
    --ink: #0b1020;
    --muted: #64748b;
    --line: #e2e8f0;
    --dash: #dfe5ee;
    --dark: #111827;
    --disabled: #8b909c;
    --badge: #eef2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: #fff;
  }
  .wrap { max-width: 640px; margin: 0 auto 0 46px; padding: 30px 0 60px; width: calc(100% - 92px); }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .date { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 600; font-size: 14px; }
  h1 { font-size: 40px; line-height: 1.1; margin: 14px 0 2px; font-weight: 800; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }

  .composer {
    display: flex; align-items: center; gap: 12px;
    margin-top: 32px; padding: 16px;
    border: 1px solid var(--line); border-radius: 20px;
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
  }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; padding: 0; overflow: hidden; flex: none; }
  .seg button {
    border: 0; background: transparent; padding: 11px 12px; font: inherit;
    font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .seg button.active { background: var(--dark); color: #fff; border-radius: 10px; }
  .composer input {
    flex: 1; min-width: 0; height: 38px; padding: 0 14px; font: inherit; font-size: 14px;
    border: 1px solid var(--line); border-radius: 10px; outline: none; color: var(--ink);
  }
  .composer input:focus, .seg button:focus-visible, .add:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
  .composer input::placeholder { color: #94a3b8; }
  .add {
    display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 18px;
    border: 0; border-radius: 10px; font: inherit; font-weight: 700; font-size: 14px;
    color: #fff; background: var(--disabled); cursor: not-allowed; flex: none;
  }
  .add.ready { background: var(--dark); cursor: pointer; }

  .section { margin-top: 34px; }
  .section-head { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 700; font-size: 14px; letter-spacing: .02em; }
  .count { background: var(--badge); color: var(--ink); border-radius: 999px; font-size: 12px; padding: 3px 9px; font-weight: 700; }
  .box { margin-top: 14px; }
  .empty {
    border: 1px dashed var(--dash); border-radius: 16px; padding: 32px 16px;
    text-align: center; color: var(--muted); font-size: 14px;
  }
  .task {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 8px;
    border: 1px solid var(--line); border-radius: 14px; background: #fff;
  }
  .task input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--dark); cursor: pointer; flex: none; }
  .task .text { flex: 1; font-size: 14px; overflow-wrap: anywhere; }
  .task.done .text { text-decoration: line-through; color: #94a3b8; }
  .del {
    border: 0; background: transparent; color: #94a3b8; cursor: pointer; padding: 6px; border-radius: 8px; display: flex;
  }
  .del:hover { color: #dc2626; background: #fef2f2; }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .ghost {
    display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff;
    border-radius: 10px; padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .ghost:hover { color: var(--ink); border-color: #cbd5e1; }
  .section-head .spacer { flex: 1; }
  .reset { padding: 4px 10px; font-size: 12px; }
  .grip { color: #cbd5e1; cursor: grab; display: flex; }
  .task.dragging { opacity: .4; }
  .task.over-top { box-shadow: 0 -3px 0 #6366f1; }
  .task.over-bottom { box-shadow: 0 3px 0 #6366f1; }
  .task .when { font-size: 12px; color: #94a3b8; }
  .hidden { display: none !important; }
  .day { border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 14px; }
  .day h3 { margin: 0 0 4px; font-size: 15px; }
  .day .meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .day h4 { margin: 12px 0 6px; font-size: 12px; color: var(--muted); font-weight: 700; }
  .day ul { list-style: none; margin: 0; padding: 0; }
  .day li { font-size: 14px; padding: 3px 0; display: flex; gap: 8px; }
  .day li.yes { color: #15803d; }
  .day li.no { color: #dc2626; }
  .day li .mark { width: 16px; text-align: center; flex: none; }

  .tabs { position: relative; display: flex; gap: 28px; margin-top: 30px; border-bottom: 1px solid var(--line); }
  .tab { border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 700; color: var(--muted);
         padding: 0 2px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: color .2s; }
  .tab:hover, .tab.active { color: var(--ink); }
  .tab:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; border-radius: 6px; }
  .ink { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--dark); border-radius: 2px;
         transition: transform .3s cubic-bezier(.4,0,.2,1), width .3s cubic-bezier(.4,0,.2,1); }
  .panel { display: none; padding-top: 16px; }
  .panel.active { display: block; animation: panelIn .28s ease both; }
  .panel-bar { display: flex; justify-content: flex-end; min-height: 30px; }
  .panel-bar .box-gap { flex: 1; }
  @keyframes panelIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .panel.active { animation: none; } .ink { transition: none; } }
  .filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-top: 28px; }
  .filters label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .filters input { height: 36px; padding: 0 10px; font: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); }
  .pager { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 22px; font-size: 13px; color: var(--muted); }
  .pager .ghost:disabled { opacity: .4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="date">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>
      <span id="date"></span>
    </div>
    <button class="ghost" id="viewBtn" type="button">History</button>
  </div>
  <h1>Questly</h1>
  <p class="sub" id="sub">Add your first task below.</p>

  <div id="todoView">
  <div class="composer">
    <div class="seg" id="seg">
      <button type="button" data-type="daily" class="active">Daily</button>
      <button type="button" data-type="project">Projects</button>
    </div>
    <input id="input" type="text" placeholder="e.g. Wash the dishes" autocomplete="off" />
    <button id="add" class="add" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Add
    </button>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="daily" type="button">Daily <span class="count" id="daily-count">0</span></button>
    <button class="tab" data-tab="project" type="button">Projects <span class="count" id="project-count">0</span></button>
    <span class="ink" id="ink"></span>
  </div>

  <div class="panel active" id="panel-daily">
    <div class="panel-bar"><button class="ghost reset hidden" id="resetBtn" type="button">Reset dailies</button></div>
    <div class="box" id="daily-list"></div>
  </div>
  <div class="panel" id="panel-project">
    <div class="box" id="project-list"></div>
  </div>
  </div>
  <div id="historyView" class="hidden">
    <div class="filters">
      <label>From <input type="date" id="fromDate" /></label>
      <label>To <input type="date" id="toDate" /></label>
      <button class="ghost" id="clearFilter" type="button">Clear</button>
    </div>
    <div id="historyList"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>

<script>
  const input = document.getElementById('input');
  const addBtn = document.getElementById('add');
  const seg = document.getElementById('seg');
  const resetBtn = document.getElementById('resetBtn');
  const viewBtn = document.getElementById('viewBtn');
  let state = { tasks: [], log: {}, lastOpened: null };
  let type = 'daily';
  let showHistory = false;
  let dragId = null;

  const key = (d = new Date()) => d.toLocaleDateString('en-CA'); // YYYY-MM-DD, local time
  const pretty = (k) => new Date(k + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  const persist = () => window.todoApi.save(state);

  document.getElementById('date').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
  });

  // ---- STEP 3: history log (one record per day for dailies) ----
  function ensureLog() {
    const k = key();
    state.log[k] = state.log[k] || {};
    state.tasks.filter((t) => t.type === 'daily').forEach((t) => {
      if (!state.log[k][t.id]) state.log[k][t.id] = { text: t.text, done: t.done };
    });
  }

  // New day: uncheck dailies, start a fresh log entry
  function rollover() {
    const k = key();
    if (state.lastOpened !== k) {
      state.tasks.forEach((t) => { if (t.type === 'daily') t.done = false; });
      state.lastOpened = k;
    }
    ensureLog();
    persist();
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  // ---- STEP 1: drag to reorder ----
  function moveTask(id, targetId, after) {
    const from = state.tasks.findIndex((t) => t.id === id);
    const [item] = state.tasks.splice(from, 1);
    let to = state.tasks.findIndex((t) => t.id === targetId);
    if (after) to += 1;
    state.tasks.splice(to, 0, item);
    persist();
    render();
  }

  function renderRow(task) {
    const row = el('div', 'task' + (task.done ? ' done' : ''));
    row.draggable = true;

    row.addEventListener('dragstart', (e) => { dragId = task.id; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    row.addEventListener('dragend', () => { dragId = null; render(); });
    row.addEventListener('dragover', (e) => {
      const dragged = state.tasks.find((t) => t.id === dragId);
      if (!dragged || dragged.type !== task.type || dragId === task.id) return;
      e.preventDefault();
      const r = row.getBoundingClientRect();
      const after = e.clientY > r.top + r.height / 2;
      row.classList.toggle('over-top', !after);
      row.classList.toggle('over-bottom', after);
    });
    row.addEventListener('dragleave', () => row.classList.remove('over-top', 'over-bottom'));
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      const after = row.classList.contains('over-bottom');
      if (dragId && dragId !== task.id) moveTask(dragId, task.id, after);
    });

    const grip = el('span', 'grip');
    grip.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"/></svg>';

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = task.done;
    cb.setAttribute('aria-label', 'Mark done');
    cb.onchange = () => {
      task.done = cb.checked;
      if (task.type === 'daily') {
        ensureLog();
        state.log[key()][task.id] = { text: task.text, done: cb.checked };
      } else {
        task.doneAt = cb.checked ? key() : null; // projects: remember the date finished
      }
      persist(); render();
    };

    const text = el('span', 'text', task.text);
    const del = el('button', 'del');
    del.setAttribute('aria-label', 'Delete task');
    del.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';
    del.onclick = () => {
      state.tasks = state.tasks.filter((x) => x.id !== task.id);
      if (task.type === 'daily' && !task.done && state.log[key()]) delete state.log[key()][task.id];
      persist(); render();
    };

    row.append(grip, cb, text);
    if (task.type === 'project' && task.done && task.doneAt) row.append(el('span', 'when', 'Finished ' + task.doneAt));
    row.append(del);
    return row;
  }

  function render() {
    for (const t of ['daily', 'project']) {
      const list = document.getElementById(t + '-list');
      const items = state.tasks.filter((x) => x.type === t);
      document.getElementById(t + '-count').textContent = items.length;
      list.innerHTML = '';
      if (!items.length) {
        list.appendChild(el('div', 'empty', t === 'daily' ? 'No daily tasks yet.' : 'No projects tasks yet.'));
      } else {
        items.forEach((task) => list.appendChild(renderRow(task)));
      }
    }
    // STEP 2: reset button shows when at least one daily is done
    resetBtn.classList.toggle('hidden', !state.tasks.some((t) => t.type === 'daily' && t.done));
    document.getElementById('sub').textContent = state.tasks.length
      ? `${state.tasks.filter((t) => !t.done).length} left to do.`
      : 'Add your first task below.';
    renderHistory();
    moveInk();
  }

  // ---- history view: date filter + pagination ----
  const PAGE_SIZE = 7;
  let histPage = 1;
  const fromInput = document.getElementById('fromDate');
  const toInput = document.getElementById('toDate');

  function renderHistory() {
    const box = document.getElementById('historyList');
    const pager = document.getElementById('pager');
    box.innerHTML = '';
    pager.innerHTML = '';

    const projectsByDate = {};
    state.tasks.filter((t) => t.type === 'project' && t.done && t.doneAt).forEach((t) => {
      (projectsByDate[t.doneAt] = projectsByDate[t.doneAt] || []).push(t.text);
    });
    let dates = [...new Set([...Object.keys(state.log), ...Object.keys(projectsByDate)])].sort().reverse();
    if (fromInput.value) dates = dates.filter((d) => d >= fromInput.value);
    if (toInput.value) dates = dates.filter((d) => d <= toInput.value);

    if (!dates.length) {
      const e = el('div', 'empty', fromInput.value || toInput.value ? 'No records in this date range.' : 'No history yet. Finish a task and it will show up here.');
      e.style.marginTop = '24px';
      box.appendChild(e);
      return;
    }

    const pages = Math.ceil(dates.length / PAGE_SIZE);
    if (histPage > pages) histPage = pages;
    dates.slice((histPage - 1) * PAGE_SIZE, histPage * PAGE_SIZE).forEach((d) => {
      const entries = Object.values(state.log[d] || {});
      const doneCount = entries.filter((e) => e.done).length;
      const card = el('div', 'day');
      card.appendChild(el('h3', '', pretty(d) + (d === key() ? ' (today)' : '')));
      if (entries.length) {
        card.appendChild(el('div', 'meta', `${doneCount} of ${entries.length} daily tasks done`));
        card.appendChild(el('h4', '', 'Daily'));
        const ul = el('ul');
        entries.forEach((e) => {
          const li = el('li', e.done ? 'yes' : 'no');
          li.append(el('span', 'mark', e.done ? '✓' : '✗'), el('span', '', e.text));
          ul.appendChild(li);
        });
        card.appendChild(ul);
      }
      if (projectsByDate[d]) {
        card.appendChild(el('h4', '', 'Projects finished'));
        const ul = el('ul');
        projectsByDate[d].forEach((p) => {
          const li = el('li', 'yes');
          li.append(el('span', 'mark', '✓'), el('span', '', p));
          ul.appendChild(li);
        });
        card.appendChild(ul);
      }
      box.appendChild(card);
    });

    if (pages > 1) {
      const go = (n) => { histPage = n; renderHistory(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      const prev = el('button', 'ghost', 'Previous');
      prev.disabled = histPage === 1;
      prev.onclick = () => go(histPage - 1);
      const next = el('button', 'ghost', 'Next');
      next.disabled = histPage === pages;
      next.onclick = () => go(histPage + 1);
      pager.append(prev, el('span', '', `Page ${histPage} of ${pages} · ${dates.length} days`), next);
    }
  }

  [fromInput, toInput].forEach((i) => i.addEventListener('change', () => { histPage = 1; renderHistory(); }));
  document.getElementById('clearFilter').addEventListener('click', () => {
    fromInput.value = ''; toInput.value = ''; histPage = 1; renderHistory();
  });

  // ---- tabs (Daily / Projects) with sliding underline ----
  function moveInk() {
    const active = document.querySelector('.tab.active');
    const ink = document.getElementById('ink');
    if (!active) return;
    ink.style.width = active.offsetWidth + 'px';
    ink.style.transform = `translateX(${active.offsetLeft}px)`;
  }

  function setTab(t) {
    type = t; // new tasks go to the tab you're on
    document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === t));
    document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('active', p.id === 'panel-' + t));
    seg.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.type === t));
    input.placeholder = t === 'daily' ? 'e.g. Wash the dishes' : 'e.g. Finish the landing page';
    moveInk();
  }

  function setView(h) {
    showHistory = h;
    document.getElementById('todoView').classList.toggle('hidden', h);
    document.getElementById('historyView').classList.toggle('hidden', !h);
    document.querySelector('h1').textContent = h ? 'History' : 'Questly';
    document.getElementById('sub').classList.toggle('hidden', h);
    viewBtn.textContent = h ? 'Back to tasks' : 'History';
  }

  function updateAddState() { addBtn.classList.toggle('ready', input.value.trim().length > 0); }

  function addTask() {
    const text = input.value.trim();
    if (!text) return;
    state.tasks.push({ id: Date.now() + Math.random(), text, type, done: false, doneAt: null });
    input.value = '';
    updateAddState();
    ensureLog();
    persist(); render();
    input.focus();
  }

  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) { setTab(b.dataset.type); input.focus(); }
  });
  document.getElementById('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('.tab');
    if (b) setTab(b.dataset.tab);
  });
  window.addEventListener('resize', moveInk);
  input.addEventListener('input', updateAddState);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });
  addBtn.addEventListener('click', addTask);
  viewBtn.addEventListener('click', () => setView(!showHistory));
  // Reset keeps today's history as-is, it only unchecks the boxes
  resetBtn.addEventListener('click', () => {
    state.tasks.forEach((t) => { if (t.type === 'daily') t.done = false; });
    persist(); render();
  });

  (async () => {
    const saved = await window.todoApi.load();
    state = { tasks: [], log: {}, lastOpened: null, ...saved };
    rollover();
    render();
    setTab('daily');
    setInterval(() => { if (state.lastOpened !== key()) { rollover(); render(); } }, 60000); // app left open past midnight
  })();
</script>
</body>
</html>
